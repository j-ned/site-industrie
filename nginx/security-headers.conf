# En-têtes de sécurité de toutes les réponses, erreurs comprises (`always`). nginx n'hérite pas
# des add_header d'un bloc parent dès qu'un bloc en déclare un : ce fichier est inclus dans chaque
# location. Styles inline : Astro en émet (balises <style>, attributs style). Aucun script inline
# exécuté (le JSON-LD n'en est pas un). `mailto:` : le formulaire de devis de la démo ouvre la
# messagerie du visiteur.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
