<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f47"/><stop offset="1" stop-color="#1d2025"/>
    </linearGradient>
    <pattern id="p" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="48" stroke="#ffffff" stroke-opacity=".05" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>
  <rect width="100%" height="100%" fill="url(#p)"/>
  <text x="50%" y="50%" text-anchor="middle" font-family="ui-monospace, monospace" font-size="25" fill="#c9ced6">Opérateur au réglage</text>
  <text x="50%" y="50%" dy="50" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" fill="#8a919c">Photo du client, 900 × 1100</text>
</svg>
